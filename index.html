<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lukisan Pixel Art 8-Bit 🎨👾</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0c20;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 550px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.95rem;
      color: #00ffcc;
      margin-bottom: 20px;
      line-height: 1.6;
      text-shadow: 2px 2px #ff2a5f;
    }

    /* Area Upload / Status Foto */
    .upload-box {
      border: 2px dashed #ff2a5f;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      background: rgba(255, 42, 95, 0.05);
      cursor: pointer;
      transition: 0.3s;
    }

    .upload-box:hover {
      background: rgba(255, 42, 95, 0.15);
    }

    input[type="file"] {
      display: none;
    }

    .upload-label {
      cursor: pointer;
      font-size: 0.85rem;
      color: #ffd1b3;
      display: block;
    }

    /* Controls Slider */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: left;
    }

    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    input[type="range"] {
      width: 50%;
      accent-color: #00ffcc;
      cursor: pointer;
    }

    /* Container Canvas Output */
    .canvas-wrapper {
      background: #000;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      display: inline-block;
      margin-bottom: 20px;
      max-width: 100%;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Tombol */
    .btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #ff2a5f;
      color: white;
      box-shadow: 0 4px 0 #990026;
      transition: 0.1s;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #990026;
    }

    .btn:disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>FOTO TO PIXEL ART 8-BIT 🎨</h1>

    <!-- Upload Input / Ganti Foto -->
    <div class="upload-box" onclick="document.getElementById('imageInput').click()">
      <label class="upload-label" id="uploadLabel">
        🔄 Memuat foto bawaan...
      </label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <!-- Controls Slider -->
    <div class="controls">
      <div class="control-group">
        <label for="pixelSize">Ukuran Piksel (Detail):</label>
        <input type="range" id="pixelSize" min="4" max="32" value="12">
      </div>
      <div class="control-group">
        <label for="colorPalette">Warna Retro (Posterize):</label>
        <input type="range" id="colorPalette" min="2" max="16" value="6">
      </div>
    </div>

    <!-- Output Canvas -->
    <div class="canvas-wrapper">
      <canvas id="pixelCanvas"></canvas>
    </div>

    <br>
    <button class="btn" id="downloadBtn" onclick="downloadImage()" disabled>Simpan Gambar 💾</button>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const pixelSizeInput = document.getElementById('pixelSize');
    const colorPaletteInput = document.getElementById('colorPalette');
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');
    const uploadLabel = document.getElementById('uploadLabel');

    let loadedImage = null;

    // 1. FOTO OTOMATIS DIMUAT SAAT HALAMAN DIBUKA
    window.addEventListener('DOMContentLoaded', () => {
      // ⬇️ GANTI 'foto-ku.jpg' DENGAN NAMA FILE FOTO KAMU ATAU LINK URL GAMBAR ⬇️
      muatFotoBawaan('foto-ann.jpeg'); 
    });

    function muatFotoBawaan(src) {
      loadedImage = new Image();
      loadedImage.crossOrigin = "Anonymous"; 
      
      loadedImage.onload = function() {
        renderPixelArt();
        downloadBtn.disabled = false;
        uploadLabel.innerText = "📸 Foto otomatis dimuat (Klik untuk ganti foto)";
      };

      loadedImage.onerror = function() {
        uploadLabel.innerText = "⚠️️ Foto 'foto-ku.jpg' tidak ditemukan! Klik untuk upload manual.";
      };

      loadedImage.src = src;
    }

    // 2. Pengguna Bisa Tetap Mengganti Foto Lewat Input Upload
    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      uploadLabel.innerText = `📸 File: ${file.name}`;

      const reader = new FileReader();
      reader.onload = function(event) {
        loadedImage = new Image();
        loadedImage.onload = function() {
          renderPixelArt();
          downloadBtn.disabled = false;
        };
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 3. Render Ulang saat Slider Digeser
    pixelSizeInput.addEventListener('input', renderPixelArt);
    colorPaletteInput.addEventListener('input', renderPixelArt);

    // 4. Proses Konversi Foto Asli Ke Lukisan Pixel Art
    function renderPixelArt() {
      if (!loadedImage) return;

      const pixelSize = parseInt(pixelSizeInput.value);
      const colorLevels = parseInt(colorPaletteInput.value);

      const maxCanvasWidth = 450;
      let scale = 1;
      if (loadedImage.width > maxCanvasWidth) {
        scale = maxCanvasWidth / loadedImage.width;
      }

      const width = Math.floor(loadedImage.width * scale);
      const height = Math.floor(loadedImage.height * scale);

      canvas.width = width;
      canvas.height = height;

      const smallWidth = Math.max(1, Math.floor(width / pixelSize));
      const smallHeight = Math.max(1, Math.floor(height / pixelSize));

      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = smallWidth;
      tempCanvas.height = smallHeight;

      tempCtx.drawImage(loadedImage, 0, 0, smallWidth, smallHeight);

      const imgData = tempCtx.getImageData(0, 0, smallWidth, smallHeight);
      const data = imgData.data;

      const step = 255 / (colorLevels - 1);
      for (let i = 0; i < data.length; i += 4) {
        data[i]     = Math.round(data[i] / step) * step;     // Red
        data[i + 1] = Math.round(data[i + 1] / step) * step; // Green
        data[i + 2] = Math.round(data[i + 2] / step) * step; // Blue
      }
      tempCtx.putImageData(imgData, 0, 0);

      ctx.imageSmoothingEnabled = false;
      ctx.mozImageSmoothingEnabled = false;
      ctx.webkitImageSmoothingEnabled = false;
      ctx.msImageSmoothingEnabled = false;

      ctx.drawImage(tempCanvas, 0, 0, smallWidth, smallHeight, 0, 0, width, height);
    }

    // 5. Simpan Hasil Piksel Ke HP/Laptop
    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'lukisan-pixel-8bit.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
