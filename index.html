<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animasi Pixel ke Smooth 📸✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0c20;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.9rem;
      color: #00ffcc;
      margin-bottom: 20px;
      line-height: 1.6;
      text-shadow: 2px 2px #ff2a5f;
    }

    /* SISTEM HALAMAN (PAGE TRANSITION) */
    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* HALAMAN 1: INPUT FOTO */
    .upload-box {
      border: 2px dashed #ff2a5f;
      border-radius: 12px;
      padding: 25px 15px;
      width: 100%;
      margin-bottom: 20px;
      background: rgba(255, 42, 95, 0.05);
      cursor: pointer;
      transition: 0.3s;
    }

    .upload-box:hover {
      background: rgba(255, 42, 95, 0.15);
      border-color: #00ffcc;
    }

    input[type="file"] { display: none; }

    .preview-box {
      width: 100%;
      max-height: 250px;
      border-radius: 10px;
      object-fit: contain;
      margin-bottom: 15px;
      display: none;
      border: 2px solid #00ffcc;
    }

    /* HALAMAN 2: ANIMASI PIXEL TO SMOOTH */
    .canvas-wrapper {
      background: #000;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      max-width: 100%;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .status-text {
      font-size: 0.85rem;
      color: #ffd1b3;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* TOMBOL UTAMA */
    .btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #ff2a5f;
      color: white;
      box-shadow: 0 4px 0 #990026;
      transition: 0.1s;
      width: 100%;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #990026;
    }

    .btn:disabled {
      background: #444;
      box-shadow: none;
      cursor: not-allowed;
      color: #888;
    }

    .btn-secondary {
      background: #00ffcc;
      color: #0f0c20;
      box-shadow: 0 4px 0 #00997a;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ================= HALAMAN 1: MENU INPUT ================= -->
    <div id="page1" class="page active">
      <h1>INPUT FOTO KAMU 📸</h1>

      <div class="upload-box" onclick="document.getElementById('photoInput').click()">
        <p id="uploadLabel">📁 Klik di sini untuk memilih foto dari perangkat</p>
        <input type="file" id="photoInput" accept="image/*">
      </div>

      <img id="previewImg" class="preview-box" alt="Preview Foto">

      <button id="processBtn" class="btn" disabled>LANJUT PROSES ➔</button>
    </div>

    <!-- ================= HALAMAN 2: ANIMASI PROSES ================= -->
    <div id="page2" class="page">
      <h1>PROSES PIXEL ART 👾</h1>

      <div class="canvas-wrapper">
        <canvas id="animCanvas"></canvas>
      </div>

      <div id="statusText" class="status-text">Memproses piksel buram...</div>

      <button id="replayBtn" class="btn btn-secondary" onclick="startPixelAnimation()">Putar Ulang Animasi 🔄</button>
      <button class="btn" onclick="goToPage(1)">Upload Foto Lain 📁</button>
    </div>

  </div>

  <script>
    // Elemen DOM
    const photoInput = document.getElementById('photoInput');
    const uploadLabel = document.getElementById('uploadLabel');
    const previewImg = document.getElementById('previewImg');
    const processBtn = document.getElementById('processBtn');
    
    const canvas = document.getElementById('animCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const replayBtn = document.getElementById('replayBtn');

    let loadedImage = null;
    let animationFrameId = null;

    // 1. Opsi Upload Foto di Halaman 1
    photoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      uploadLabel.innerText = `📄 File: ${file.name}`;
      
      const reader = new FileReader();
      reader.onload = function(event) {
        loadedImage = new Image();
        loadedImage.onload = function() {
          // Tampilkan preview foto di Halaman 1
          previewImg.src = event.target.result;
          previewImg.style.display = 'block';
          processBtn.disabled = false; // Aktifkan tombol Lanjut
        };
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 2. Klik Tombol Lanjut Proses -> Pindah Halaman 2
    processBtn.addEventListener('click', function() {
      goToPage(2);
      startPixelAnimation();
    });

    // 3. Fungsi Navigasi Pindah Halaman
    function goToPage(pageNum) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById(`page${pageNum}`).classList.add('active');

      if (pageNum === 1) {
        // Stop animasi jika kembali ke halaman 1
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
      }
    }

    // 4. LOGIKA ANIMASI: PIXEL BURAM (8-BIT) -> SMOOTH
    function startPixelAnimation() {
      if (!loadedImage) return;

      // Batasi ukuran canvas agar performa tetap cepat
      const maxW = 400;
      let scale = 1;
      if (loadedImage.width > maxW) scale = maxW / loadedImage.width;

      const w = Math.floor(loadedImage.width * scale);
      const h = Math.floor(loadedImage.height * scale);

      canvas.width = w;
      canvas.height = h;

      // Buat Canvas Offscreen sementara untuk mengecilkan foto
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');

      // Parameter Animasi
      let currentScale = 0.02; // Mulai dari piksel sangat kasar/buram (2% ukuran asli)
      const targetScale = 1.0;  // Berakhir di 100% (smooth)
      const speed = 0.008;      // Kecepatan transisi perubahan piksel

      replayBtn.disabled = true;

      function renderFrame() {
        if (currentScale < targetScale) {
          currentScale += speed;
          if (currentScale > targetScale) currentScale = targetScale;

          // Ukuran grid piksel mini
          const sw = Math.max(1, Math.floor(w * currentScale));
          const sh = Math.max(1, Math.floor(h * currentScale));

          tempCanvas.width = sw;
          tempCanvas.height = sh;

          // Gambar foto asli ke bentuk mini
          tempCtx.drawImage(loadedImage, 0, 0, sw, sh);

          // Render kembali ke canvas utama dengan skala besar
          // Jika skala masih kecil, matikan smoothing agar tampak piksel kotak-kotak
          const isSmoothing = currentScale > 0.85;
          ctx.imageSmoothingEnabled = isSmoothing;
          ctx.mozImageSmoothingEnabled = isSmoothing;
          ctx.webkitImageSmoothingEnabled = isSmoothing;

          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(tempCanvas, 0, 0, sw, sh, 0, 0, w, h);

          // Update Teks Status berdasarkan persentase
          const percent = Math.floor((currentScale / targetScale) * 100);
          statusText.innerText = `⏳ Memproses Piksel: ${percent}%...`;

          animationFrameId = requestAnimationFrame(renderFrame);
        } else {
          // Hasil Akhir: Foto Halus / Smooth Sempurna
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(loadedImage, 0, 0, w, h);
          statusText.innerText = "✨ Selesai! Foto kembali smooth sempurna.";
          replayBtn.disabled = false;
        }
      }

      // Hentikan animasi sebelumnya jika ada & jalankan yang baru
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      renderFrame();
    }
  </script>
</body>
</html>
