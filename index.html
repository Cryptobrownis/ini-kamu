<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketsa Pensil Berwarna Pixel to Smooth ✏️🎨</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1026;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      position: relative;
    }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.85rem;
      color: #ff70a6;
      margin-bottom: 20px;
      line-height: 1.6;
      text-shadow: 2px 2px #70d6ff;
    }

    /* SISTEM HALAMAN */
    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* HALAMAN 1: INPUT FOTO */
    .upload-box {
      border: 2px dashed #ff70a6;
      border-radius: 12px;
      padding: 25px 15px;
      width: 100%;
      margin-bottom: 20px;
      background: rgba(255, 112, 166, 0.05);
      cursor: pointer;
      transition: 0.3s;
    }

    .upload-box:hover {
      background: rgba(255, 112, 166, 0.15);
      border-color: #70d6ff;
    }

    input[type="file"] { display: none; }

    .preview-box {
      width: 100%;
      max-height: 250px;
      border-radius: 10px;
      object-fit: contain;
      margin-bottom: 15px;
      display: none;
      border: 2px solid #70d6ff;
    }

    /* HALAMAN 2: ANIMASI SKETSA BERWARNA */
    .canvas-wrapper {
      background: #fff; /* Latar putih khas kertas gambar */
      border: 3px solid #70d6ff;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      max-width: 100%;
      box-shadow: 0 0 20px rgba(112, 214, 255, 0.3);
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .status-text {
      font-size: 0.85rem;
      color: #ffd670;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* TOMBOL UTAMA */
    .btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #ff70a6;
      color: white;
      box-shadow: 0 4px 0 #c4386d;
      transition: 0.1s;
      width: 100%;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #c4386d;
    }

    .btn:disabled {
      background: #333;
      box-shadow: none;
      cursor: not-allowed;
      color: #666;
    }

    .btn-secondary {
      background: #70d6ff;
      color: #0f1026;
      box-shadow: 0 4px 0 #2ca1cc;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ================= HALAMAN 1: MENU INPUT ================= -->
    <div id="page1" class="page active">
      <h1>PENSIL BERWARNA ✏️🎨</h1>

      <div class="upload-box" onclick="document.getElementById('photoInput').click()">
        <p id="uploadLabel">📁 Klik di sini untuk memilih foto dari perangkat</p>
        <input type="file" id="photoInput" accept="image/*">
      </div>

      <img id="previewImg" class="preview-box" alt="Preview Foto">

      <button id="processBtn" class="btn" disabled>LANJUT PROSES ➔</button>
    </div>

    <!-- ================= HALAMAN 2: ANIMASI PROSES ================= -->
    <div id="page2" class="page">
      <h1>SKETSA BERWARNA ✏️🎨</h1>

      <div class="canvas-wrapper">
        <canvas id="animCanvas"></canvas>
      </div>

      <div id="statusText" class="status-text">Mempersiapkan sketsa berwarna...</div>

      <button id="replayBtn" class="btn btn-secondary" onclick="startSketchAnimation()">Putar Ulang Animasi 🔄</button>
      <button class="btn" onclick="goToPage(1)">Upload Foto Lain 📁</button>
    </div>

  </div>

  <script>
    const photoInput = document.getElementById('photoInput');
    const uploadLabel = document.getElementById('uploadLabel');
    const previewImg = document.getElementById('previewImg');
    const processBtn = document.getElementById('processBtn');
    
    const canvas = document.getElementById('animCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const replayBtn = document.getElementById('replayBtn');

    let loadedImage = null;
    let sketchCanvas = null; // Canvas penampung hasil sketsa pensil berwarna
    let animationFrameId = null;

    // 1. Input Foto Pengguna
    photoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      uploadLabel.innerText = `📄 File: ${file.name}`;
      
      const reader = new FileReader();
      reader.onload = function(event) {
        loadedImage = new Image();
        loadedImage.onload = function() {
          previewImg.src = event.target.result;
          previewImg.style.display = 'block';
          processBtn.disabled = false;
        };
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 2. Klik Tombol Lanjut
    processBtn.addEventListener('click', function() {
      goToPage(2);
      generateColoredPencilSketch();
      startSketchAnimation();
    });

    function goToPage(pageNum) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById(`page${pageNum}`).classList.add('active');

      if (pageNum === 1 && animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }
    }

    // 3. FUNGSI MEMBUAT EFEK SKETSA PENSIL BERWARNA
    function generateColoredPencilSketch() {
      const maxW = 450;
      let scale = 1;
      if (loadedImage.width > maxW) scale = maxW / loadedImage.width;

      const w = Math.floor(loadedImage.width * scale);
      const h = Math.floor(loadedImage.height * scale);

      sketchCanvas = document.createElement('canvas');
      sketchCanvas.width = w;
      sketchCanvas.height = h;
      const sCtx = sketchCanvas.getContext('2d');

      sCtx.drawImage(loadedImage, 0, 0, w, h);
      const imgData = sCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // Buat array grayscale untuk deteksi garis tepi (Sobel)
      const gray = new Float32Array(w * h);
      for (let i = 0; i < data.length; i += 4) {
        gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      }

      const sketchData = sCtx.createImageData(w, h);
      const sData = sketchData.data;

      // Operator Sobel + Blending Warna Asli (Pencil Coloring)
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;

          // Deteksi tepi dengan Sobel Operator
          const gx =
            -1 * gray[idx - w - 1] + 1 * gray[idx - w + 1] +
            -2 * gray[idx - 1]     + 2 * gray[idx + 1] +
            -1 * gray[idx + w - 1] + 1 * gray[idx + w + 1];

          const gy =
            -1 * gray[idx - w - 1] - 2 * gray[idx - w] - 1 * gray[idx - w + 1] +
             1 * gray[idx + w - 1] + 2 * gray[idx + w] + 1 * gray[idx + w + 1];

          const magnitude = Math.sqrt(gx * gx + gy * gy);
          
          // Faktor arsiran pensil (1.0 = kertas terang, 0.0 = garis tebal)
          let edgeFactor = (255 - (magnitude * 1.6)) / 255;
          if (edgeFactor < 0) edgeFactor = 0;
          if (edgeFactor > 1) edgeFactor = 1;

          const pIdx = idx * 4;
          const r = data[pIdx];
          const g = data[pIdx + 1];
          const b = data[pIdx + 2];

          // Penggabungan warna foto asli dengan kontur pensil (Efek Sketsa Pensil Berwarna)
          const paperBrightness = 25; // Sentuhan efek pencerah kertas
          sData[pIdx]     = Math.min(255, (r + paperBrightness) * edgeFactor); // Red
          sData[pIdx + 1] = Math.min(255, (g + paperBrightness) * edgeFactor); // Green
          sData[pIdx + 2] = Math.min(255, (b + paperBrightness) * edgeFactor); // Blue
          sData[pIdx + 3] = 255; // Alpha
        }
      }

      sCtx.putImageData(sketchData, 0, 0);

      canvas.width = w;
      canvas.height = h;
    }

    // 4. ANIMASI SLOW-MOTION (PIXEL BURAM -> SKETSA SMOOTH)
    function startSketchAnimation() {
      if (!sketchCanvas) return;

      const w = canvas.width;
      const h = canvas.height;

      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');

      let currentScale = 0.02; // Mulai dari piksel sangat besar/buram (2%)
      const targetScale = 1.0; 
      
      // KECEPATAN TRANSISI ANIMASI (Dibuat sangat lambat & mulus)
      const speed = 0.0012; 

      replayBtn.disabled = true;

      function renderFrame() {
        if (currentScale < targetScale) {
          currentScale += speed;
          if (currentScale > targetScale) currentScale = targetScale;

          const sw = Math.max(1, Math.floor(w * currentScale));
          const sh = Math.max(1, Math.floor(h * currentScale));

          tempCanvas.width = sw;
          tempCanvas.height = sh;

          // Render versi piksel mini
          tempCtx.drawImage(sketchCanvas, 0, 0, sw, sh);

          // Aktifkan smoothing saat mendekati akhir (85%) agar menjadi jernih & smooth
          const isSmoothing = currentScale > 0.85;
          ctx.imageSmoothingEnabled = isSmoothing;
          ctx.mozImageSmoothingEnabled = isSmoothing;
          ctx.webkitImageSmoothingEnabled = isSmoothing;

          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(tempCanvas, 0, 0, sw, sh, 0, 0, w, h);

          const percent = Math.floor((currentScale / targetScale) * 100);
          statusText.innerText = `✏️ Menggambar Sketsa Berwarna: ${percent}%...`;

          animationFrameId = requestAnimationFrame(renderFrame);
        } else {
          // Hasil Akhir: Sketsa Pensil Berwarna Mulus & Smooth Sempurna
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(sketchCanvas, 0, 0, w, h);
          statusText.innerText = "✨ Selesai! Sketsa pensil berwarna terbentuk sempurna.";
          replayBtn.disabled = false;
        }
      }

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      renderFrame();
    }
  </script>
</body>
</html>
